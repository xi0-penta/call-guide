# Validates the ChatGPT -> GitHub workflow and required static site files.
# This branch push is also used to verify Cloudflare Preview deployments.
name: Static Check

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required site files
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f equal-love/index.html
          test -f not-equal-me/index.html
          test -f nearly-equal-joy/index.html
          echo "Required site files are present."

      - name: Build Equal Love page
        run: npm run build:equal-love

      - name: Verify Equal Love search
        run: npm run verify:equal-love-search

      - name: Verify Equal Love page
        run: npm run verify:equal-love-page

      - name: Verify generated Equal Love files are current
        shell: bash
        run: |
          set -e
          git diff --exit-code -- equal-love/index.html generated/equal-love-song-cards.html
          echo "Generated Equal Love files are up to date."

      - name: Build Not Equal Me page
        run: npm run build:not-equal-me

      - name: Verify Not Equal Me search
        run: npm run verify:not-equal-me-search

      - name: Verify Not Equal Me page
        run: npm run verify:not-equal-me-page

      - name: Verify generated Not Equal Me files are current
        shell: bash
        run: |
          set -e
          git diff --exit-code -- not-equal-me/index.html generated/not-equal-me-song-batches.html
          echo "Generated Not Equal Me files are up to date."
