<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fffafc">
  <title>イコノイジョイ 現場コールガイド</title>

  <style>
    :root{
      --text:#2f3142;
      --muted:#747789;

      --love:#ff6fa9;
      --love-soft:#ffd6e5;
      --love-bg:#fff1f6;

      --me:#58c9ad;
      --me-soft:#c9f0e6;
      --me-bg:#effbf7;

      --joy:#f2c84b;
      --joy-soft:#fff0a9;
      --joy-bg:#fff9df;

      --panel:rgba(255,255,255,.80);
      --line:rgba(255,255,255,.92);
      --shadow:0 20px 50px rgba(84,70,92,.12);
      --card-shadow:0 10px 26px rgba(84,70,92,.08);
    }

    *{
      box-sizing:border-box;
    }

    html{
      min-height:100%;
      background:#fffafc;
    }

    body{
      margin:0;
      min-height:100vh;
      min-height:100dvh;
      color:var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;

      background:
        radial-gradient(circle at 8% 5%, rgba(255,111,169,.20) 0%, transparent 28%),
        radial-gradient(circle at 92% 12%, rgba(88,201,173,.18) 0%, transparent 29%),
        radial-gradient(circle at 52% 100%, rgba(242,200,75,.20) 0%, transparent 31%),
        linear-gradient(145deg,#fff9fc 0%,#fbfbff 47%,#fffdf5 100%);

      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        max(24px, env(safe-area-inset-top))
        18px
        max(24px, env(safe-area-inset-bottom));
    }

    .wrap{
      width:100%;
      max-width:920px;
    }

    .panel{
      position:relative;
      overflow:hidden;
      padding:34px 20px 24px;
      border:1px solid var(--line);
      border-radius:30px;
      background:var(--panel);
      box-shadow:var(--shadow);
      -webkit-backdrop-filter:blur(16px);
      backdrop-filter:blur(16px);
    }

    .panel::before{
      content:"";
      position:absolute;
      width:180px;
      height:180px;
      border-radius:50%;
      left:-80px;
      top:-100px;
      background:rgba(255,111,169,.10);
      filter:blur(2px);
      pointer-events:none;
    }

    .panel::after{
      content:"";
      position:absolute;
      width:190px;
      height:190px;
      border-radius:50%;
      right:-90px;
      bottom:-105px;
      background:rgba(242,200,75,.12);
      filter:blur(2px);
      pointer-events:none;
    }

    .hero{
      position:relative;
      z-index:1;
      text-align:center;
      margin-bottom:28px;
    }

    .eyebrow{
      margin:0 0 9px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.16em;
      color:#8a7e89;
    }

    h1{
      margin:0;
      font-size:clamp(29px,7vw,44px);
      line-height:1.18;
      letter-spacing:.035em;
      font-weight:850;
      color:#30313f;
    }

    .sub{
      margin:12px 0 0;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      letter-spacing:.10em;
    }

    .group-list{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }

    .group-card{
      position:relative;
      display:block;
      overflow:hidden;
      min-height:142px;
      padding:18px 18px 17px 20px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.96);
      text-decoration:none;
      color:inherit;
      box-shadow:var(--card-shadow);
      -webkit-tap-highlight-color:transparent;
      transition:
        transform .16s ease,
        box-shadow .16s ease;
    }

    .group-card:active{
      transform:scale(.985);
      box-shadow:0 6px 18px rgba(84,70,92,.07);
    }

    .group-card::before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:7px;
      border-radius:22px 0 0 22px;
    }

    .group-card::after{
      content:"";
      position:absolute;
      width:110px;
      height:110px;
      right:-40px;
      top:-48px;
      border-radius:50%;
      opacity:.42;
      pointer-events:none;
    }

    .love{
      background:
        linear-gradient(135deg,rgba(255,255,255,.97),rgba(255,241,246,.96));
    }

    .love::before{
      background:linear-gradient(180deg,var(--love),var(--love-soft));
    }

    .love::after{
      background:var(--love-soft);
    }

    .me{
      background:
        linear-gradient(135deg,rgba(255,255,255,.97),rgba(239,251,247,.97));
    }

    .me::before{
      background:linear-gradient(180deg,var(--me),var(--me-soft));
    }

    .me::after{
      background:var(--me-soft);
    }

    .joy{
      background:
        linear-gradient(135deg,rgba(255,255,255,.97),rgba(255,249,223,.97));
    }

    .joy::before{
      background:linear-gradient(180deg,var(--joy),var(--joy-soft));
    }

    .joy::after{
      background:var(--joy-soft);
    }

    .card-head{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:82px;
      min-height:30px;
      padding:6px 12px;
      border-radius:999px;
      color:#fff;
      font-size:12px;
      line-height:1;
      font-weight:850;
      letter-spacing:.08em;
      box-shadow:0 5px 13px rgba(75,60,78,.08);
    }

    .love .badge{
      background:linear-gradient(135deg,var(--love),#ff9cc3);
    }

    .me .badge{
      background:linear-gradient(135deg,var(--me),#87d9c6);
    }

    .joy .badge{
      background:linear-gradient(135deg,#e6b930,var(--joy));
      color:#fff;
    }

    .arrow{
      position:relative;
      z-index:1;
      display:grid;
      place-items:center;
      width:34px;
      height:34px;
      border-radius:50%;
      background:rgba(255,255,255,.82);
      color:#8d8c99;
      font-size:23px;
      line-height:1;
      box-shadow:0 5px 14px rgba(75,60,78,.06);
    }

    .group-name{
      position:relative;
      z-index:1;
      margin:15px 0 4px;
      font-size:23px;
      line-height:1.2;
      font-weight:850;
      letter-spacing:.02em;
    }

    .love .group-name{
      color:#c9477d;
    }

    .me .group-name{
      color:#318b75;
    }

    .joy .group-name{
      color:#9d7811;
    }

    .desc{
      position:relative;
      z-index:1;
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
    }

    .footer{
      position:relative;
      z-index:1;
      margin-top:20px;
      text-align:center;
      color:#9b9299;
      font-size:10px;
      letter-spacing:.08em;
    }

    @media (min-width:720px){
      body{
        padding-left:28px;
        padding-right:28px;
      }

      .panel{
        padding:42px 34px 30px;
      }

      .hero{
        margin-bottom:32px;
      }

      .group-list{
        grid-template-columns:repeat(3,1fr);
        gap:16px;
      }

      .group-card{
        min-height:220px;
        padding:20px;
      }

      .group-name{
        margin-top:30px;
        font-size:25px;
      }

      .desc{
        font-size:13.5px;
      }
    }

    @media (hover:hover){
      .group-card:hover{
        transform:translateY(-3px);
        box-shadow:0 15px 32px rgba(84,70,92,.11);
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="panel">
      <header class="hero">
        <p class="eyebrow">IKONOIJOY CALL GUIDE</p>
        <h1>イコノイジョイ<br>現場コールガイド</h1>
        <p class="sub">GROUP SELECT</p>
      </header>

      <nav class="group-list" aria-label="グループ選択">
        <a class="group-card love" href="./equal-love/">
          <div class="card-head">
            <span class="badge">=LOVE</span>
            <span class="arrow" aria-hidden="true">›</span>
          </div>
          <h2 class="group-name">イコラブ</h2>
          <p class="desc">=LOVE の現場コールガイドを見る</p>
        </a>

        <a class="group-card me" href="./not-equal-me/">
          <div class="card-head">
            <span class="badge">≠ME</span>
            <span class="arrow" aria-hidden="true">›</span>
          </div>
          <h2 class="group-name">ノイミー</h2>
          <p class="desc">≠ME の現場コールガイドを見る</p>
        </a>

        <a class="group-card joy" href="./nearly-equal-joy/">
          <div class="card-head">
            <span class="badge">≒JOY</span>
            <span class="arrow" aria-hidden="true">›</span>
          </div>
          <h2 class="group-name">ニアジョイ</h2>
          <p class="desc">≒JOY の現場コールガイドを見る</p>
        </a>
      </nav>

      <div class="footer">IKONOIJOY</div>
    </section>
  </main>
</body>
</html>
