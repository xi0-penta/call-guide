<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>イコノイジョイ 現場コールガイド</title>
  <style>
    :root {
      --bg1: #fff8fb;
      --bg2: #f7f8ff;
      --text: #2f3142;
      --muted: #6e728a;
      --card: rgba(255, 255, 255, 0.82);
      --border: rgba(255, 255, 255, 0.75);
      --shadow: 0 18px 40px rgba(70, 60, 100, 0.12);

      --love1: #ff6fa9;
      --love2: #ffb2cd;

      --me1: #8f82ff;
      --me2: #c1bbff;

      --joy1: #4fc8b5;
      --joy2: #a7efe5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #ffe6f0 0%, transparent 32%),
        radial-gradient(circle at top right, #ebe8ff 0%, transparent 30%),
        radial-gradient(circle at bottom center, #dffaf5 0%, transparent 28%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 920px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 32px 22px 26px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .title {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .subtitle {
      margin: 12px 0 0;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      display: block;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 22px;
      padding: 20px 20px 18px;
      box-shadow: 0 10px 24px rgba(90, 90, 120, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.95);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:active {
      transform: scale(0.985);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 8px;
      border-radius: 22px 0 0 22px;
    }

    .card-love::before {
      background: linear-gradient(180deg, var(--love1), var(--love2));
    }

    .card-me::before {
      background: linear-gradient(180deg, var(--me1), var(--me2));
    }

    .card-joy::before {
      background: linear-gradient(180deg, var(--joy1), var(--joy2));
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 86px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: white;
      flex-shrink: 0;
    }

    .badge-love {
      background: linear-gradient(135deg, var(--love1), var(--love2));
    }

    .badge-me {
      background: linear-gradient(135deg, var(--me1), var(--me2));
    }

    .badge-joy {
      background: linear-gradient(135deg, var(--joy1), var(--joy2));
    }

    .arrow {
      font-size: 24px;
      color: #9aa0b8;
      line-height: 1;
      flex-shrink: 0;
    }

    .name {
      margin: 14px 0 6px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .footer-note {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    @media (min-width: 720px) {
      .panel {
        padding: 40px 34px 30px;
      }

      .cards {
        grid-template-columns: repeat(3, 1fr);
      }

      .card {
        min-height: 230px;
        padding: 20px;
      }

      .card-top {
        align-items: flex-start;
      }

      .name {
        margin-top: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <div class="hero">
        <h1 class="title">イコノイジョイ<br>現場コールガイド</h1>
        <p class="subtitle">IKONOIJOY CALL GUIDE</p>
      </div>

      <div class="cards">
        <a class="card card-love" href="./equal-love/">
          <div class="card-top">
            <span class="badge badge-love">=LOVE</span>
            <span class="arrow">›</span>
          </div>
          <h2 class="name">イコラブ</h2>
          <p class="desc">=LOVE のコールガイドを見る</p>
        </a>

        <a class="card card-me" href="./not-equal-me/">
          <div class="card-top">
            <span class="badge badge-me">≠ME</span>
            <span class="arrow">›</span>
          </div>
          <h2 class="name">ノイミー</h2>
          <p class="desc">≠ME のコールガイドを見る</p>
        </a>

        <a class="card card-joy" href="./nearly-equal-joy/">
          <div class="card-top">
            <span class="badge badge-joy">≒JOY</span>
            <span class="arrow">›</span>
          </div>
          <h2 class="name">ニアジョイ</h2>
          <p class="desc">≒JOY のコールガイドを見る</p>
        </a>
      </div>

      <div class="footer-note">現場で見やすいシンプルな導線にしています</div>
    </section>
  </main>
</body>
</html>
