<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf5">

  <title>≒JOY 現場コールガイド</title>

  <style>
    :root{
      --text:#2f3142;
      --muted:#777789;

      --joy:#f2c84b;
      --joy-dark:#d4a91f;
      --joy-soft:#fff0a9;
      --joy-bg:#fff9df;

      --panel:rgba(255,255,255,.84);
      --line:rgba(255,255,255,.94);

      --shadow:0 20px 50px rgba(103,87,47,.12);
      --shadow-soft:0 10px 26px rgba(103,87,47,.08);
    }

    *{
      box-sizing:border-box;
    }

    html{
      min-height:100%;
      background:#fffdf5;
    }

    body{
      margin:0;
      min-height:100vh;
      min-height:100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;

      color:var(--text);

      background:
        radial-gradient(
          circle at 90% 5%,
          rgba(242,200,75,.25) 0%,
          transparent 30%
        ),
        radial-gradient(
          circle at 5% 95%,
          rgba(255,240,169,.46) 0%,
          transparent 32%
        ),
        linear-gradient(
          145deg,
          #fffdf6 0%,
          #fffaf0 50%,
          #fffdf8 100%
        );

      display:flex;
      align-items:center;
      justify-content:center;

      padding:
        max(24px, env(safe-area-inset-top))
        18px
        max(24px, env(safe-area-inset-bottom));
    }

    .wrap{
      width:100%;
      max-width:580px;
    }

    .card{
      position:relative;
      overflow:hidden;

      width:100%;
      padding:38px 22px 26px;

      text-align:center;

      background:var(--panel);
      border:1px solid var(--line);
      border-radius:30px;

      box-shadow:var(--shadow);

      -webkit-backdrop-filter:blur(16px);
      backdrop-filter:blur(16px);
    }

    .card::before{
      content:"";
      position:absolute;

      width:190px;
      height:190px;

      top:-105px;
      right:-95px;

      border-radius:50%;

      background:rgba(242,200,75,.16);

      pointer-events:none;
    }

    .card::after{
      content:"";
      position:absolute;

      width:160px;
      height:160px;

      left:-95px;
      bottom:-100px;

      border-radius:50%;

      background:rgba(255,240,169,.22);

      pointer-events:none;
    }

    .content{
      position:relative;
      z-index:1;
    }

    .eyebrow{
      margin:0 0 14px;

      color:#9f8950;

      font-size:11px;
      font-weight:800;
      letter-spacing:.15em;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      min-width:88px;
      min-height:34px;

      padding:7px 14px;

      border-radius:999px;

      background:
        linear-gradient(
          135deg,
          var(--joy-dark),
          var(--joy)
        );

      color:#fff;

      font-size:13px;
      font-weight:850;
      letter-spacing:.08em;

      box-shadow:
        0 7px 17px rgba(210,169,31,.20);
    }

    h1{
      margin:20px 0 10px;

      font-size:30px;
      line-height:1.3;
      font-weight:850;

      letter-spacing:.025em;

      color:#7f6512;
    }

    .message{
      margin:0;

      color:var(--muted);

      font-size:14px;
      line-height:1.85;
    }

    .status{
      display:inline-flex;
      align-items:center;
      gap:7px;

      margin-top:18px;
      padding:7px 12px;

      border-radius:999px;

      background:var(--joy-bg);
      border:1px solid #f0dda1;

      color:#987714;

      font-size:11px;
      font-weight:800;
    }

    .status-dot{
      width:7px;
      height:7px;

      border-radius:50%;

      background:var(--joy);

      box-shadow:
        0 0 0 4px rgba(242,200,75,.16);
    }

    .actions{
      display:flex;
      flex-direction:column;

      gap:10px;

      margin-top:28px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;

      min-height:48px;

      padding:12px 16px;

      border-radius:15px;

      text-decoration:none;

      font-size:14px;
      font-weight:800;

      -webkit-tap-highlight-color:transparent;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .btn:active{
      transform:scale(.985);
    }

    .btn-main{
      color:#fff;

      background:
        linear-gradient(
          135deg,
          var(--joy-dark),
          var(--joy)
        );

      box-shadow:
        0 8px 18px rgba(210,169,31,.18);
    }

    .btn-sub{
      color:#625c51;

      background:rgba(255,255,255,.93);

      border:1px solid #eee3c9;

      box-shadow:var(--shadow-soft);
    }

    .footer{
      margin-top:22px;

      color:#a59a80;

      font-size:10px;
      letter-spacing:.10em;
    }

    @media (min-width:720px){
      .card{
        padding:44px 34px 30px;
      }

      h1{
        font-size:34px;
      }

      .actions{
        display:grid;
        grid-template-columns:1fr 1fr;
      }

      .btn-main{
        grid-column:1 / -1;
      }
    }

    @media (hover:hover){
      .btn:hover{
        transform:translateY(-2px);
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <section class="card">

      <div class="content">

        <p class="eyebrow">
          ≒JOY CALL GUIDE
        </p>

        <div class="badge">
          ≒JOY
        </div>

        <h1>
          ニアジョイ<br>
          現場コールガイド
        </h1>

        <p class="message">
          現在準備中です。<br>
          公開までしばらくお待ちください。
        </p>

        <div class="status">
          <span class="status-dot"></span>
          COMING SOON
        </div>

        <div class="actions">

          <a
            class="btn btn-main"
            href="../"
          >
            トップへ戻る
          </a>

          <a
            class="btn btn-sub"
            href="../equal-love/"
          >
            イコラブを見る
          </a>

          <a
            class="btn btn-sub"
            href="../not-equal-me/"
          >
            ノイミーを見る
          </a>

        </div>

        <div class="footer">
          IKONOIJOY CALL GUIDE
        </div>

      </div>

    </section>

  </main>

</body>
</html>
