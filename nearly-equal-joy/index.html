<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ニアジョイ コールガイド</title>
  <style>
    :root {
      --bg1: #f7fffd;
      --bg2: #f7fbff;
      --text: #2f3142;
      --muted: #6f7488;
      --joy1: #4fc8b5;
      --joy2: #a7efe5;
      --shadow: 0 18px 40px rgba(70, 60, 100, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, #dbfaf3 0%, transparent 28%),
        radial-gradient(circle at bottom left, #eef7ff 0%, transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 36px 24px 28px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--joy1), var(--joy2));
      color: white;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: 30px;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 15px;
    }

    .actions {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      text-decoration: none;
      border-radius: 16px;
      padding: 14px 16px;
      font-weight: 700;
      font-size: 15px;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--joy1), var(--joy2));
      color: white;
    }

    .btn-sub {
      background: #f2f5fb;
      color: var(--text);
    }

    @media (min-width: 720px) {
      .actions {
        flex-direction: row;
        justify-content: center;
      }

      .btn {
        min-width: 180px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">≒JOY</div>
    <h1>ニアジョイ<br>コールガイド</h1>
    <p>このページは準備中です。<br>公開までしばらくお待ちください。</p>

    <div class="actions">
      <a class="btn btn-main" href="../">トップへ戻る</a>
      <a class="btn btn-sub" href="../equal-love/">イコラブを見る</a>
      <a class="btn btn-sub" href="../not-equal-me/">ノイミーを見る</a>
    </div>
  </main>
</body>
</html>
